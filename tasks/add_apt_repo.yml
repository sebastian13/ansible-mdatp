---

- name: Remove legacy Microsoft key from /etc/apt/trusted.gpg.d (if present)
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/microsoft-packages.gpg
    state: absent
  when: ansible_os_family == "Debian"

- name: Remove stray temp file (if present)
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/microsoft-packages.gpg~
    state: absent
  when: ansible_os_family == "Debian"

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Microsoft APT key (rolling) and dearmor to keyring
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft-rolling.asc
    dest: /usr/share/keyrings/microsoft-rolling.asc
    mode: '0644'

- name: Convert Microsoft key to gpg keyring (binary)
  ansible.builtin.command:
    cmd: "gpg --dearmor -o /usr/share/keyrings/microsoft-packages.gpg /usr/share/keyrings/microsoft-rolling.asc"
    creates: /usr/share/keyrings/microsoft-packages.gpg

- name: Remove Microsoft ASCII key after conversion
  ansible.builtin.file:
    path: /usr/share/keyrings/microsoft-rolling.asc
    state: absent

- name: Add Microsoft Apt Repository Debian 11 (Bullseye)
  ansible.builtin.apt_repository:
    repo: deb [arch=arm64,armhf,amd64 signed-by=/usr/share/keyrings/microsoft-packages.gpg] https://packages.microsoft.com/debian/11/{{ channel }} bullseye main
    update_cache: true
    state: present
    filename: microsoft-{{ channel }}
  when: ansible_os_family == "Debian" and ansible_distribution == "Debian" and ansible_distribution_major_version|int == 11

- name: Add Microsoft Apt Repository Debian 12 (Bookworm)
  ansible.builtin.apt_repository:
    repo: deb [arch=arm64,armhf,amd64 signed-by=/usr/share/keyrings/microsoft-packages.gpg] https://packages.microsoft.com/debian/12/{{ channel }} bookworm main
    update_cache: true
    state: present
    filename: microsoft-{{ channel }}
  when: ansible_os_family == "Debian" and ansible_distribution == "Debian" and ansible_distribution_major_version|int == 12

- name: Add Microsoft Apt Repository Debian 13 (Trixie)
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-packages.gpg] https://packages.microsoft.com/debian/13/{{ channel }} trixie main
    filename: microsoft-{{ channel }}
    update_cache: true
    state: present
  when: ansible_os_family == "Debian" and ansible_distribution == "Debian" and ansible_distribution_major_version | int == 13
