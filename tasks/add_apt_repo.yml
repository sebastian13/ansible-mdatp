---

- name: Check supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] | int in [11, 12, 13]
    fail_msg: "Only Debian 11, 12 and 13 are supported, found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
    quiet: true

- name: Remove legacy Microsoft keys and repository files (if present)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/microsoft-packages.gpg
    - /etc/apt/trusted.gpg.d/microsoft-packages.gpg~
    # One-line format written by earlier versions (ansible.builtin.apt_repository)
    - "/etc/apt/sources.list.d/microsoft-{{ mdatp_channel }}.list"

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

# Microsoft signs its repositories with different keys:
#   microsoft.asc         (EB3E94ADBE1229CF) - e.g. debian/11, debian/12
#   microsoft-rolling.asc (EE4D7792F748182B) - e.g. debian/13
# The keyring contains both. The .asc files are kept to detect key changes.
- name: Download Microsoft APT keys
  ansible.builtin.get_url:
    url: "https://packages.microsoft.com/keys/{{ item }}"
    dest: "/usr/share/keyrings/{{ item }}"
    mode: '0644'
  loop:
    - microsoft.asc
    - microsoft-rolling.asc
  register: mdatp_ms_keys

- name: Check Microsoft keyring
  ansible.builtin.stat:
    path: /usr/share/keyrings/microsoft-packages.gpg
  register: mdatp_ms_keyring

- name: Build Microsoft keyring from all keys
  ansible.builtin.shell: |
    set -euo pipefail
    tmp=$(mktemp -d)
    trap 'rm -rf "$tmp"' EXIT
    for key in microsoft.asc microsoft-rolling.asc; do
      gpg --batch --yes --dearmor -o "$tmp/$key.gpg" "/usr/share/keyrings/$key"
    done
    cat "$tmp/microsoft.asc.gpg" "$tmp/microsoft-rolling.asc.gpg" > "$tmp/microsoft-packages.gpg"
    install -m 0644 -o root -g root "$tmp/microsoft-packages.gpg" /usr/share/keyrings/microsoft-packages.gpg
  args:
    executable: /bin/bash
  when: mdatp_ms_keys is changed or not mdatp_ms_keyring.stat.exists
  changed_when: true

# Writes /etc/apt/sources.list.d/microsoft-<channel>.sources (deb822 format)
- name: Add Microsoft APT repository
  ansible.builtin.deb822_repository:
    name: "microsoft-{{ mdatp_channel }}"
    types: deb
    uris: "https://packages.microsoft.com/debian/{{ ansible_facts['distribution_major_version'] }}/{{ mdatp_channel }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: [amd64, arm64, armhf]
    signed_by: /usr/share/keyrings/microsoft-packages.gpg
    state: present
