---

- name: Install Requirements
  ansible.builtin.apt:
    name:
      - unzip
      - gpg
      - python3-debian   # required by ansible.builtin.deb822_repository
    update_cache: true

# https://m365admin.handsontek.net/microsoft-defender-endpoint-linux-removing-netfilter-dependency/
- name: Remove mde-netfilter if installed
  ansible.builtin.apt:
    name: mde-netfilter
    state: absent

- name: Deploy the Onboarding Information
  ansible.builtin.import_tasks: onboarding_setup.yml

- name: Add the apt repository
  ansible.builtin.import_tasks: add_apt_repo.yml

- name: Install MDATP
  ansible.builtin.apt:
    name: mdatp
    state: "{{ mdatp_package_state }}"
    update_cache: true

- name: Configure scheduled scans
  ansible.builtin.import_tasks: scan_setup.yml

- name: Deploy managed configuration
  ansible.builtin.import_tasks: managed_config.yml
