---

- name: Create MDATP directories
  ansible.builtin.file:
    path: /etc/opt/microsoft/mdatp/
    recurse: true
    state: directory
    mode: '0755'
    owner: root
    group: root

# Preferred: onboarding info from inventory (group_vars/host_vars).
# Accepts a YAML mapping or a raw JSON string; both are normalized to JSON.
# force: false keeps the behaviour of only onboarding devices that are not onboarded yet.
- name: Deploy mdatp_onboard.json from inventory variable
  ansible.builtin.copy:
    content: "{{ (mdatp_onboard_json | from_json if mdatp_onboard_json is string else mdatp_onboard_json) | to_json }}"
    dest: /etc/opt/microsoft/mdatp/mdatp_onboard.json
    mode: '0600'
    owner: root
    group: root
    force: false
  # Do not print the onboarding info with --diff
  diff: false
  when: mdatp_onboard_json is not none

# Fallback: onboarding zip from files/
- name: Extract onboarding package into /etc/opt/microsoft/mdatp - {{ mdatp_onboarding_package }}
  ansible.builtin.unarchive:
    src: "{{ mdatp_onboarding_package }}"
    dest: /etc/opt/microsoft/mdatp
    mode: '0600'
    owner: root
    group: root
    creates: /etc/opt/microsoft/mdatp/mdatp_onboard.json
  when: mdatp_onboard_json is none
