---
# Microsoft package channel: prod | insiders-fast | insiders-slow
# Falls back to the deprecated variable 'channel' for existing inventories.
mdatp_channel: "{{ channel | default('prod') }}"

# Content of mdatp_onboard.json from the Microsoft Defender onboarding package.
# Define it per customer/tenant in group_vars (as YAML mapping or as raw JSON string).
# If unset, the role falls back to extracting mdatp_onboarding_package.
mdatp_onboard_json: ~

# Fallback: onboarding zip, looked up in the role's or playbook's files/ directory.
mdatp_onboarding_package: 'GatewayWindowsDefenderATPOnboardingPackage.zip'

# Package state of mdatp ('present' or 'latest').
# 'latest' keeps the agent up to date on every run (security fixes, engine updates).
# The built-in scan scheduler requires mdatp >= mdatp_scan_builtin_min_version.
mdatp_package_state: 'latest'

# --- Antivirus (written to mdatp_managed.json) ---
# https://learn.microsoft.com/en-us/defender-endpoint/linux-preferences

# real_time (recommended) | on_demand | passive | audit (requires >= 101.26062.0007)
mdatp_enforcement_level: 'real_time'
# Only effective with real_time
mdatp_behavior_monitoring: true
# Threads for on-demand scans (1-64)
mdatp_scan_max_threads: 2

# audit | block | off
mdatp_threat_pua: 'block'
mdatp_threat_archive_bomb: 'audit'

mdatp_cloud_enabled: true
mdatp_automatic_definition_update: true
mdatp_sample_submission: 'none'       # none | safe | all
mdatp_cloud_block_level: 'normal'     # normal | moderate | high | high_plus | zero_tolerance
mdatp_proxy: ''                       # e.g. 'http://proxy.example.com:3128/'

# Device tag (edr.tags, key GROUP), e.g. customer name for filtering/device groups in the portal
mdatp_device_tag: ''

# Antivirus exclusions in Microsoft's JSON format, e.g.:
#   - { "$type": "excludedPath", "isDirectory": true, "path": "/var/lib/postgresql/", "scopes": ["epp"] }
#   - { "$type": "excludedFileExtension", "extension": ".bak", "scopes": ["epp"] }
#   - { "$type": "excludedFileName", "name": "/usr/sbin/mysqld", "scopes": ["epp"] }
# https://learn.microsoft.com/en-us/defender-endpoint/linux-exclusions
mdatp_exclusions: []
mdatp_exclusions_merge_policy: 'merge'   # merge | admin_only

# Additional managed settings for /etc/opt/microsoft/mdatp/managed/mdatp_managed.json.
# Merged recursively on top of all settings generated by this role.
# https://learn.microsoft.com/en-us/defender-endpoint/linux-preferences
mdatp_managed_config: {}

# --- Scheduled scans ---
# https://learn.microsoft.com/en-us/defender-endpoint/configure-anti-virus-scans-linux
# https://learn.microsoft.com/en-us/defender-endpoint/schedule-antivirus-scans-linux
#
# builtin: built-in scheduler via mdatp_managed.json (recommended by Microsoft).
#          Falls back to cron if the installed mdatp is older than mdatp_scan_builtin_min_version.
# cron:    crontab entries
# none:    no scheduled scans
mdatp_scan_method: 'builtin'
mdatp_scan_builtin_min_version: '101.26032.0000'

# Daily quick scan; time in minutes after midnight (local time), 120 = 02:00
mdatp_scan_daily: true
mdatp_scan_daily_time_of_day: 120
# Additional quick scan every N hours (0 = disabled, builtin only)
mdatp_scan_daily_interval: 0

# Weekly scan; day: 0 = disabled, 1-7 = Sunday-Saturday, 8 = every day
mdatp_scan_weekly_day: 0          # disabled until full scan duration is known
mdatp_scan_weekly_time_of_day: 180
mdatp_scan_weekly_type: 'full'    # quick | full

# Randomize start time within a window of N hours (0-23) to avoid simultaneous scans
mdatp_scan_randomize_hours: 3

# builtin only
mdatp_scan_low_priority: true
mdatp_scan_when_idle: false
mdatp_scan_check_for_definitions_update: true
mdatp_scan_ignore_exclusions: false

# Optional weekly custom scan of specific paths (always via cron),
# e.g. paths on filesystems skipped by quick/full scans. Empty list = disabled.
mdatp_scan_custom_paths: []
mdatp_scan_custom_day: 1          # 1-7 = Sunday-Saturday, 8 = every day
mdatp_scan_custom_time_of_day: 300
